<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#020617" />

  <!-- Favicon & Apple Touch Icon Inline SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310b981'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23020617' stroke-width='8'/%3E%3Cpath d='M50 32v20l14 8' fill='none' stroke='%23020617' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310b981'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23020617' stroke-width='8'/%3E%3Cpath d='M50 32v20l14 8' fill='none' stroke='%23020617' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-table-scroll::-webkit-scrollbar {
      height: 10px;
      width: 10px;
    }
    .custom-table-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 8px;
    }
    .custom-table-scroll::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 8px;
    }
    .custom-table-scroll::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }

    /* Splash Screen Styles (3 Detik) */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at 50% 42%, #292722 0%, #141311 55%, #070706 100%);
      color: #f6f1e3;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash-screen.splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-glow {
      filter: drop-shadow(0 0 18px rgba(246, 241, 227, 0.42)) drop-shadow(0 8px 16px rgba(0, 0, 0, 0.85));
      animation: splashPulseIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .splash-text-glow {
      text-shadow: 0 0 22px rgba(246, 241, 227, 0.45), 0 4px 12px rgba(0, 0, 0, 0.9);
    }
    @keyframes splashPulseIn {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    @keyframes splashProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
  <!-- Splash Screen Pembuka (Durasi 3 Detik) -->
  <div id="splash-screen" role="dialog" aria-label="Cycle Time Haryan Splash Screen">
    <div class="h-6"></div>

    <div class="flex flex-col items-center text-center max-w-md mx-auto splash-glow">
      <!-- Logo Stopwatch dengan Huruf H di Tengah -->
      <svg class="w-40 h-44 sm:w-48 sm:h-52 mb-6" viewBox="0 0 220 250" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="92" y="12" width="36" height="16" rx="4" fill="#f6f1e3" />
        <rect x="103" y="26" width="14" height="14" fill="#f6f1e3" />
        <g transform="translate(166, 46) rotate(42)">
          <rect x="-12" y="-7" width="24" height="11" rx="3" fill="#f6f1e3" />
          <rect x="-5" y="3" width="10" height="11" fill="#f6f1e3" />
        </g>
        <path d="M 90 218 A 84 84 0 1 1 130 218" stroke="#f6f1e3" stroke-width="15" stroke-linecap="butt" />
        <path d="M 74 102 L 92 102 L 92 224 L 74 224 Z" fill="#f6f1e3" />
        <rect x="86" y="148" width="48" height="16" fill="#f6f1e3" />
        <path d="M 128 126 L 146 126 L 146 218 L 128 224 Z" fill="#f6f1e3" />
        <line x1="110" y1="126" x2="110" y2="74" stroke="#f6f1e3" stroke-width="7" stroke-linecap="round" />
        <line x1="110" y1="126" x2="147" y2="89" stroke="#f6f1e3" stroke-width="7" stroke-linecap="round" />
        <circle cx="110" cy="126" r="9" fill="#f6f1e3" />
      </svg>

      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-[0.14em] uppercase splash-text-glow text-[#f6f1e3] leading-tight">
        CYCLE TIME
      </h1>
      <p class="text-xl sm:text-2xl font-bold tracking-[0.18em] uppercase splash-text-glow text-[#f6f1e3] mt-1">
        HARYAN
      </p>

      <div class="w-40 h-1 bg-white/15 rounded-full overflow-hidden mt-7">
        <div class="h-full bg-[#f6f1e3] rounded-full" style="animation: splashProgress 3s linear forwards;"></div>
      </div>
    </div>

    <p class="text-xs sm:text-sm italic text-[#e5dec9]/90 text-center max-w-xs sm:max-w-md leading-relaxed tracking-wide splash-text-glow">
      “What is made with your whole heart<br />will be received with an open heart”
    </p>
  </div>

  <div id="app"></div>

  <script>
    // ============================================================================
    // 1. OFFLINE INDEXED-DB & LOCALSTORAGE HELPER (100% Client-Side Mandiri)
    // ============================================================================
    const DB_NAME = 'CycleTimeHaryanOfflineDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'appStateStore';

    function openOfflineDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB tidak didukung'));
          return;
        }
        const request = window.indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveToStorage(key, data) {
      try {
        localStorage.setItem('ct_haryan_' + key, JSON.stringify(data));
      } catch (e) {}
      try {
        const db = await openOfflineDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(data, key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {
        return false;
      }
    }

    async function loadFromStorage(key) {
      try {
        const db = await openOfflineDB();
        const res = await new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
        if (res !== undefined && res !== null) return res;
      } catch (e) {}
      try {
        const raw = localStorage.getItem('ct_haryan_' + key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    // ============================================================================
    // 2. DATA DEFAULT & STATE APLIKASI
    // ============================================================================
    const DEFAULT_CYCLES = [
      { id: 101, lapTime: 42.0, vsTarget: -3.0, processName: 'Persiapan Kerah', operatorName: 'Siti Rahma', machineName: 'Single Needle Lockstitch', timestamp: new Date(Date.now() - 300000).toISOString() },
      { id: 102, lapTime: 58.5, vsTarget: 13.5, processName: 'Jahit Bahu & Lengan', operatorName: 'Budi Santoso', machineName: 'Single Needle', timestamp: new Date(Date.now() - 240000).toISOString() },
      { id: 103, lapTime: 39.0, vsTarget: -6.0, processName: 'Pasang Kancing', operatorName: 'Dewi Lestari', machineName: 'Buttonhole Machine', timestamp: new Date(Date.now() - 180000).toISOString() },
      { id: 104, lapTime: 65.2, vsTarget: 20.2, processName: 'Obras Samping', operatorName: 'Joko Widodo', machineName: 'Obras 4 Benang', timestamp: new Date(Date.now() - 120000).toISOString() },
      { id: 105, lapTime: 44.8, vsTarget: -0.2, processName: 'Inspeksi & Trimming', operatorName: 'Ani Yulianti', machineName: 'Manual Table', timestamp: new Date(Date.now() - 60000).toISOString() }
    ];

    const state = {
      activeTab: 'tracker',
      isDarkMode: true,
      zoomLevel: 100,
      isMenuOpen: false,
      isOnline: navigator.onLine,
      taktTime: 45,
      timeUnit: 'seconds',
      lineName: 'Line A - Jahit Kemeja',
      styleName: 'Style Formal Slimfit',
      isRunning: false,
      seconds: 0,
      cycles: [...DEFAULT_CYCLES],
      editingCycleId: null,
      originalLapTime: null
    };

    let timerInterval = null;

    // ============================================================================
    // 3. FUNGSI LOGIKA & PERHITUNGAN CYCLE TIME
    // ============================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTimeValue(valInSeconds) {
      if (state.timeUnit === 'minutes') {
        return (valInSeconds / 60).toFixed(2);
      }
      return Number(valInSeconds).toFixed(1);
    }

    function getUnitSymbol() {
      return state.timeUnit === 'minutes' ? 'm' : 's';
    }

    function persistAll() {
      saveToStorage('cycles_data', state.cycles);
      saveToStorage('settings_data', {
        taktTime: state.taktTime,
        timeUnit: state.timeUnit,
        lineName: state.lineName,
        styleName: state.styleName,
        isDarkMode: state.isDarkMode
      });
    }

    function updateTimerUIOnly() {
      const swDisplay = document.getElementById('live-stopwatch-val');
      if (swDisplay) {
        swDisplay.textContent = formatTimeValue(state.seconds);
      }
      if (state.editingCycleId) {
        const editLapEl = document.getElementById('editing-lap-' + state.editingCycleId);
        const editVsEl = document.getElementById('editing-vs-' + state.editingCycleId);
        if (editLapEl) {
          editLapEl.textContent = formatTimeValue(state.seconds) + getUnitSymbol();
        }
        if (editVsEl) {
          const diff = state.seconds - state.taktTime;
          editVsEl.textContent = (diff > 0 ? '+' + formatTimeValue(diff) : formatTimeValue(diff)) + getUnitSymbol();
          editVsEl.className = 'p-3.5 font-mono font-semibold text-base whitespace-nowrap ' + (state.seconds > state.taktTime ? 'text-rose-400' : 'text-emerald-400');
        }
      }
    }

    function startTimer() {
      if (state.isRunning) return;
      state.isRunning = true;
      timerInterval = setInterval(() => {
        state.seconds = parseFloat((state.seconds + 0.1).toFixed(1));
        updateTimerUIOnly();
      }, 100);
      render();
    }

    function stopTimer() {
      state.isRunning = false;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      render();
    }

    function resetTimer() {
      stopTimer();
      state.seconds = 0;
      render();
    }

    function recordLap() {
      if (state.seconds <= 0) return;
      const currentLap = parseFloat(state.seconds.toFixed(1));
      const vsTargetVal = parseFloat((currentLap - state.taktTime).toFixed(1));

      if (state.editingCycleId) {
        confirmReTime();
        return;
      }

      const nextCycleNumber = state.cycles.length + 1;
      const newCycle = {
        id: Date.now(),
        lapTime: currentLap,
        vsTarget: vsTargetVal,
        processName: 'Proses #' + nextCycleNumber,
        operatorName: '',
        machineName: '',
        timestamp: new Date().toISOString()
      };

      state.cycles = [newCycle, ...state.cycles];
      state.seconds = 0;
      persistAll();
      render();

      const tbl = document.getElementById('tracker-table-container');
      if (tbl) tbl.scrollTop = tbl.scrollHeight;
    }

    function startReTime(id) {
      const target = state.cycles.find((c) => c.id === id);
      if (!target) return;
      state.editingCycleId = id;
      state.originalLapTime = target.lapTime;
      state.seconds = 0;
      if (!state.isRunning) {
        startTimer();
      } else {
        render();
      }
    }

    function confirmReTime() {
      if (!state.editingCycleId) return;
      const newLapTime = parseFloat(state.seconds.toFixed(1));
      const vsTargetVal = parseFloat((newLapTime - state.taktTime).toFixed(1));

      state.cycles = state.cycles.map((c) =>
        c.id === state.editingCycleId ? { ...c, lapTime: newLapTime, vsTarget: vsTargetVal } : c
      );

      stopTimer();
      state.seconds = 0;
      state.editingCycleId = null;
      state.originalLapTime = null;
      persistAll();
      render();
    }

    function cancelReTime() {
      stopTimer();
      state.seconds = 0;
      state.editingCycleId = null;
      state.originalLapTime = null;
      render();
    }

    function deleteCycle(id) {
      if (state.editingCycleId === id) {
        state.editingCycleId = null;
        state.originalLapTime = null;
      }
      state.cycles = state.cycles.filter((c) => c.id !== id);
      persistAll();
      render();
    }

    function clearAllCycles() {
      state.cycles = [];
      state.editingCycleId = null;
      state.originalLapTime = null;
      persistAll();
      render();
    }

    function updateCycleField(id, field, value) {
      state.cycles = state.cycles.map((c) => (c.id === id ? { ...c, [field]: value } : c));
      persistAll();
    }

    function exportExcel() {
      if (state.cycles.length === 0) return;
      const chronologicalCycles = [...state.cycles].reverse();
      const sorted = [...chronologicalCycles].sort((a, b) => b.lapTime - a.lapTime);
      const top3BottleneckIds = sorted.slice(0, 3).map((item) => item.id);

      const totalCT = state.cycles.reduce((acc, c) => acc + c.lapTime, 0);
      const avgCT = totalCT / state.cycles.length;
      const avgSecs = state.timeUnit === 'minutes' ? avgCT * 60 : avgCT;
      const overallCap = avgSecs > 0 ? Math.floor(3600 / avgSecs) : 0;

      const rowsHtml = chronologicalCycles.map((c, idx) => {
        const lapT = formatTimeValue(c.lapTime);
        const vsT = c.vsTarget > 0 ? '+' + formatTimeValue(c.vsTarget) : formatTimeValue(c.vsTarget);
        const totalSeconds = state.timeUnit === 'minutes' ? c.lapTime * 60 : c.lapTime;
        const capPerHour = totalSeconds > 0 ? Math.floor(3600 / totalSeconds) : 0;

        let statusText = 'Normal Balance';
        if (top3BottleneckIds.includes(c.id)) statusText = 'Improve Immediately (Top 3)';
        else if (c.lapTime > state.taktTime) statusText = 'Bottleneck';
        else if (c.lapTime <= state.taktTime / 2) statusText = 'Potential Combine';

        return `
          <tr>
            <td style="border:1px solid #cbd5e1;padding:8px;text-align:center;">${idx + 1}</td>
            <td style="border:1px solid #cbd5e1;padding:8px;">${new Date(c.timestamp).toLocaleString('id-ID')}</td>
            <td style="border:1px solid #cbd5e1;padding:8px;text-align:right;font-weight:bold;">${lapT} ${getUnitSymbol()}</td>
            <td style="border:1px solid #cbd5e1;padding:8px;text-align:right;">${vsT} ${getUnitSymbol()}</td>
            <td style="border:1px solid #cbd5e1;padding:8px;">${escapeHtml(c.processName || '-')}</td>
            <td style="border:1px solid #cbd5e1;padding:8px;">${escapeHtml(c.operatorName || '-')}</td>
            <td style="border:1px solid #cbd5e1;padding:8px;">${escapeHtml(c.machineName || '-')}</td>
            <td style="border:1px solid #cbd5e1;padding:8px;text-align:center;">${statusText}</td>
            <td style="border:1px solid #cbd5e1;padding:8px;text-align:right;">${capPerHour} pcs/jam</td>
          </tr>
        `;
      }).join('');

      const excelHtml = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
        <head><meta charset="utf-8" /></head>
        <body>
          <h3>REPORT CYCLE TIME HARYAN</h3>
          <p><b>Line:</b> ${escapeHtml(state.lineName)} | <b>Style:</b> ${escapeHtml(state.styleName)} | <b>Takt Time:</b> ${state.taktTime}${getUnitSymbol()} | <b>Total CT:</b> ${formatTimeValue(totalCT)}${getUnitSymbol()} | <b>Avg CT:</b> ${formatTimeValue(avgCT)}${getUnitSymbol()} | <b>Kapasitas:</b> ${overallCap} pcs/jam</p>
          <table>
            <thead>
              <tr style="background:#0f172a;color:#ffffff;">
                <th>Cycle #</th><th>Waktu</th><th>Lap Time</th><th>Vs Target</th><th>Proses</th><th>Operator</th><th>Machine</th><th>Action</th><th>Kapasitas</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </body>
        </html>
      `;

      const blob = new Blob([excelHtml], { type: 'application/vnd.ms-excel;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'simulasi_cycle_time_' + state.lineName.replace(/\s+/g, '_') + '.xls';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function sendReportToWhatsApp() {
      if (state.cycles.length === 0) return;
      
      exportExcel();

      const chronologicalCycles = [...state.cycles].reverse();
      const totalCT = state.cycles.reduce((acc, c) => acc + c.lapTime, 0);
      const avgCT = totalCT / state.cycles.length;
      const avgSecs = state.timeUnit === 'minutes' ? avgCT * 60 : avgCT;
      const overallCap = avgSecs > 0 ? Math.floor(3600 / avgSecs) : 0;
      const unit = getUnitSymbol();

      let text = `📊 *LAPORAN CYCLE TIME HARYAN*%0A`;
      text += `🏢 *Line:* ${encodeURIComponent(state.lineName)}%0A`;
      text += `👕 *Style:* ${encodeURIComponent(state.styleName)}%0A`;
      text += `⏱ *Takt Time:* ${state.taktTime}${unit} | *Kapasitas:* ${overallCap} pcs/jam%0A`;
      text += `📈 *Total CT:* ${formatTimeValue(totalCT)}${unit} | *Avg CT:* ${formatTimeValue(avgCT)}${unit}%0A%0A`;
      text += `📋 *Rincian Proses (${state.cycles.length}):*%0A`;

      chronologicalCycles.forEach((c, idx) => {
        text += `${idx + 1}. *${encodeURIComponent(c.processName || 'Proses')}* (${formatTimeValue(c.lapTime)}${unit}) - ${encodeURIComponent(c.operatorName || 'Operator -')}%0A`;
      });

      text += `%0A📎 _File laporan Excel (.xls) telah diunduh ke perangkat Anda. Silakan lampirkan file tersebut ke chat ini jika diperlukan._`;
      
      window.open('https://api.whatsapp.com/send?text=' + text, '_blank');
    }

    // ============================================================================
    // 4. RENDER ANTARMUKA PENGGUNA (UI)
    // ============================================================================
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      const dark = state.isDarkMode;
      const unit = getUnitSymbol();
      const totalCT = state.cycles.reduce((acc, c) => acc + c.lapTime, 0);
      const avgCT = state.cycles.length > 0 ? totalCT / state.cycles.length : 0;
      const avgSecs = state.timeUnit === 'minutes' ? avgCT * 60 : avgCT;
      const capacityPcs = avgSecs > 0 ? Math.floor(3600 / avgSecs) : 0;

      const chronological = [...state.cycles].reverse();
      const sortedForChart = [...chronological].sort((a, b) => b.lapTime - a.lapTime);
      const top3BottleneckIds = sortedForChart.slice(0, 3).map((item) => item.id);

      let mainContentHtml = '';

      if (state.activeTab === 'tracker') {
        mainContentHtml = `
          <div class="space-y-6">
            <section class="${dark ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-300 shadow-md'} border rounded-2xl p-4 sm:p-6 shadow-xl">
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                  <span class="text-emerald-500 font-bold">📊</span>
                  <h2 class="text-base font-bold ${dark ? 'text-white' : 'text-slate-900'}">
                    Log (${state.cycles.length})
                  </h2>
                </div>
                ${state.cycles.length > 0 ? `
                  <button onclick="clearAllCycles()" class="text-sm text-rose-400 hover:text-rose-300 font-semibold cursor-pointer transition-colors flex items-center gap-1">
                    <span>🗑 Hapus Semua Log</span>
                  </button>
                ` : ''}
              </div>

              <div id="tracker-table-container" class="overflow-x-auto overflow-y-auto custom-table-scroll border ${dark ? 'border-slate-800' : 'border-slate-200'} rounded-xl max-h-[50vh] pb-1">
                <table class="w-full min-w-[920px] text-left text-sm">
                  <thead class="${dark ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-100 border-slate-200 text-slate-700'} border-b sticky top-0 z-10 shadow-sm whitespace-nowrap">
                    <tr>
                      <th class="p-3.5 w-24">Cycle #</th>
                      <th class="p-3.5">Lap Time (${unit})</th>
                      <th class="p-3.5">Vs Target (${unit})</th>
                      <th class="p-3.5 min-w-[210px]">Proses</th>
                      <th class="p-3.5 min-w-[180px]">Nama Operator</th>
                      <th class="p-3.5 min-w-[190px]">Machine</th>
                      <th class="p-3.5 w-28 text-center">Edit Time</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y ${dark ? 'divide-slate-800/40' : 'divide-slate-200'}">
                    ${state.cycles.length === 0 ? `
                      <tr>
                        <td colspan="7" class="text-center py-12 ${dark ? 'text-slate-400' : 'text-slate-500'} text-sm">
                          Belum ada data siklus. Tekan tombol <strong class="text-emerald-400">START</strong> lalu <strong class="text-emerald-400">LAP / CYCLE</strong> di bilah kontrol bawah.
                        </td>
                      </tr>
                    ` : chronological.map((c, index) => {

    // ============================================================================
    // 5. BOOTSTRAP AWAL & REGISTRASI PWA OFFLINE
    // ============================================================================
    (async function initApp() {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('splash-hidden');
          setTimeout(() => splash.remove(), 650);
        }
      }, 3000);

      render();

      window.addEventListener('online', () => { state.isOnline = true; render(); });
      window.addEventListener('offline', () => { state.isOnline = false; render(); });

      const savedCycles = await loadFromStorage('cycles_data');
      const savedSettings = await loadFromStorage('settings_data');

      if (Array.isArray(savedCycles)) state.cycles = savedCycles;
      if (savedSettings) {
        if (typeof savedSettings.taktTime === 'number') state.taktTime = savedSettings.taktTime;
        if (savedSettings.timeUnit) state.timeUnit = savedSettings.timeUnit;
        if (savedSettings.lineName) state.lineName = savedSettings.lineName;
        if (savedSettings.styleName) state.styleName = savedSettings.styleName;
        if (typeof savedSettings.isDarkMode === 'boolean') state.isDarkMode = savedSettings.isDarkMode;
      }

      render();
    })();
