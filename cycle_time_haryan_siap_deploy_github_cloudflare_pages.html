<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cycle Time Haryan" />
  <meta name="description" content="Aplikasi Stopwatch Cycle Time & Analisis Line Produksi Garmen Mandiri (100% Offline PWA)" />
  <title>Cycle Time Haryan — Offline PWA Stopwatch</title>

  <!-- Favicon & Apple Touch Icon Inline SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310b981'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23020617' stroke-width='8'/%3E%3Cpath d='M50 32v20l14 8' fill='none' stroke='%23020617' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310b981'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23020617' stroke-width='8'/%3E%3Cpath d='M50 32v20l14 8' fill='none' stroke='%23020617' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-table-scroll::-webkit-scrollbar {
      height: 10px;
      width: 10px;
    }
    .custom-table-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 8px;
    }
    .custom-table-scroll::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 8px;
    }
    .custom-table-scroll::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
  <div id="app"></div>

  <script>
    // ============================================================================
    // 1. STATE APLIKASI & PENYIMPANAN OFFLINE INDEXED-DB (100% PURE VANILLA JS)
    // ============================================================================
    const DB_NAME = 'CycleTimeHaryanOfflineDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'appStateStore';

    const DEFAULT_CYCLES = [
      { id: 101, lapTime: 42.0, vsTarget: -3.0, processName: 'Persiapan Kerah', operatorName: 'Siti Rahma', machineName: 'Single Needle Lockstitch', timestamp: new Date(Date.now() - 300000).toISOString() },
      { id: 102, lapTime: 58.5, vsTarget: 13.5, processName: 'Jahit Bahu & Lengan', operatorName: 'Budi Santoso', machineName: 'Single Needle', timestamp: new Date(Date.now() - 240000).toISOString() },
      { id: 103, lapTime: 39.0, vsTarget: -6.0, processName: 'Pasang Kancing', operatorName: 'Dewi Lestari', machineName: 'Buttonhole Machine', timestamp: new Date(Date.now() - 180000).toISOString() },
      { id: 104, lapTime: 65.2, vsTarget: 20.2, processName: 'Obras Samping', operatorName: 'Joko Widodo', machineName: 'Obras 4 Benang', timestamp: new Date(Date.now() - 120000).toISOString() },
      { id: 105, lapTime: 44.8, vsTarget: -0.2, processName: 'Inspeksi & Trimming', operatorName: 'Ani Yulianti', machineName: 'Manual Table', timestamp: new Date(Date.now() - 60000).toISOString() }
    ];

    const state = {
      activeTab: 'tracker', // 'tracker' | 'analysis' | 'settings'
      isDarkMode: true,
      zoomLevel: 100,
      isMenuOpen: false,
      isOnline: navigator.onLine,
      deferredPrompt: null,
      taktTime: 45,
      timeUnit: 'seconds', // 'seconds' | 'minutes'
      lineName: 'Line A - Jahit Kemeja',
      styleName: 'Style Formal Slimfit',
      isRunning: false,
      seconds: 0,
      cycles: [...DEFAULT_CYCLES],
      editingCycleId: null
    };

    let startTimePerf = 0;
    let accumulatedSecs = 0;
    let timerInterval = null;

    function openOfflineDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('No IndexedDB'));
        const req = window.indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveToDB(key, val) {
      try {
        const db = await openOfflineDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(val, key);
      } catch (e) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch (err) {}
      }
    }

    async function loadFromDB(key) {
      try {
        const db = await openOfflineDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch (err) { return null; }
      }
    }

    function persistAll() {
      saveToDB('cycles_data', state.cycles);
      saveToDB('settings_data', {
        taktTime: state.taktTime,
        timeUnit: state.timeUnit,
        lineName: state.lineName,
        styleName: state.styleName,
        isDarkMode: state.isDarkMode
      });
    }

    // ============================================================================
    // 2. HELPER PERHITUNGAN & FORMATTER
    // ============================================================================
    function getUnitSymbol() {
      return state.timeUnit === 'minutes' ? 'm' : 's';
    }

    function formatTimeValue(valInSeconds) {
      if (state.timeUnit === 'minutes') {
        return (valInSeconds / 60).toFixed(2);
      }
      return valInSeconds.toFixed(1);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getMetrics() {
      const totalCycleTime = state.cycles.reduce((acc, c) => acc + c.lapTime, 0);
      const averageCycleTime = state.cycles.length > 0 ? totalCycleTime / state.cycles.length : 0;
      const avgSecs = state.timeUnit === 'minutes' ? averageCycleTime * 60 : averageCycleTime;
      const overallCapacityPcs = avgSecs > 0 ? Math.floor(3600 / avgSecs) : 0;
      return { totalCycleTime, averageCycleTime, overallCapacityPcs };
    }

    function getSequentialData() {
      const chronological = [...state.cycles].reverse();
      return chronological.map((c, index) => ({
        id: c.id,
        cycleNum: index + 1,
        name: c.processName || `Proses #${index + 1}`,
        totalTime: parseFloat(c.lapTime.toFixed(1)),
        operatorName: c.operatorName || '-',
        machineName: c.machineName || '-'
      }));
    }

    // ============================================================================
    // 3. AKSI STOPWATCH & DATA
    // ============================================================================
    function updateLiveTimerDisplay() {
      const swEl = document.getElementById('live-stopwatch-val');
      if (swEl) {
        swEl.textContent = formatTimeValue(state.seconds);
      }
      if (state.editingCycleId) {
        const editEl = document.getElementById(`edit-lap-${state.editingCycleId}`);
        if (editEl) {
          editEl.textContent = `${formatTimeValue(state.seconds)}${getUnitSymbol()}`;
        }
      }
    }

    function startStopwatch() {
      if (state.isRunning) return;
      state.isRunning = true;
      accumulatedSecs = state.seconds;
      startTimePerf = performance.now();
      timerInterval = setInterval(() => {
        state.seconds = accumulatedSecs + (performance.now() - startTimePerf) / 1000;
        updateLiveTimerDisplay();
      }, 50);
      render();
    }

    function stopStopwatch() {
      if (!state.isRunning) return;
      clearInterval(timerInterval);
      state.seconds = accumulatedSecs + (performance.now() - startTimePerf) / 1000;
      accumulatedSecs = state.seconds;
      state.isRunning = false;
      render();
    }

    function resetStopwatch() {
      clearInterval(timerInterval);
      state.isRunning = false;
      accumulatedSecs = 0;
      state.seconds = 0;
      render();
    }

    function recordLap() {
      if (state.seconds <= 0) return;
      if (state.editingCycleId) {
        confirmReTime();
        return;
      }
      const currentLap = parseFloat(state.seconds.toFixed(1));
      const vsTargetVal = parseFloat((currentLap - state.taktTime).toFixed(1));
      const nextCycleNumber = state.cycles.length + 1;

      state.cycles.unshift({
        id: Date.now(),
        lapTime: currentLap,
        vsTarget: vsTargetVal,
        processName: `Proses #${nextCycleNumber}`,
        operatorName: '',
        machineName: '',
        timestamp: new Date().toISOString()
      });

      accumulatedSecs = 0;
      startTimePerf = performance.now();
      state.seconds = 0;
      persistAll();
      render();

      const tableBox = document.getElementById('log-table-container');
      if (tableBox) tableBox.scrollTop = tableBox.scrollHeight;
    }

    function startReTime(id) {
      state.editingCycleId = id;
      clearInterval(timerInterval);
      accumulatedSecs = 0;
      state.seconds = 0;
      state.isRunning = true;
      startTimePerf = performance.now();
      timerInterval = setInterval(() => {
        state.seconds = accumulatedSecs + (performance.now() - startTimePerf) / 1000;
        updateLiveTimerDisplay();
      }, 50);
      render();
    }

    function confirmReTime() {
      if (!state.editingCycleId) return;
      const newLapTime = parseFloat(state.seconds.toFixed(1));
      const vsTargetVal = parseFloat((newLapTime - state.taktTime).toFixed(1));

      state.cycles = state.cycles.map((c) =>
        c.id === state.editingCycleId ? { ...c, lapTime: newLapTime, vsTarget: vsTargetVal } : c
      );

      clearInterval(timerInterval);
      state.isRunning = false;
      accumulatedSecs = 0;
      state.seconds = 0;
      state.editingCycleId = null;
      persistAll();
      render();
    }

    function cancelReTime() {
      clearInterval(timerInterval);
      state.isRunning = false;
      accumulatedSecs = 0;
      state.seconds = 0;
      state.editingCycleId = null;
      render();
    }

    function deleteCycle(id) {
      if (state.editingCycleId === id) state.editingCycleId = null;
      state.cycles = state.cycles.filter((c) => c.id !== id);
      persistAll();
      render();
    }

    function clearAllCycles() {
      state.cycles = [];
      state.editingCycleId = null;
      persistAll();
      render();
    }

    function updateCycleField(id, field, value) {
      const target = state.cycles.find((c) => c.id === id);
      if (target) {
        target[field] = value;
        persistAll();
      }
    }

    function exportExcelReport() {
      if (state.cycles.length === 0) return;
      const sequentialData = getSequentialData();
      const sortedForChart = [...sequentialData].sort((a, b) => b.totalTime - a.totalTime);
      const maxProcessId = sortedForChart[0]?.id;
      const { totalCycleTime, averageCycleTime, overallCapacityPcs } = getMetrics();
      const chronologicalCycles = [...state.cycles].reverse();

      const rowsHtml = chronologicalCycles.map((c, idx) => {
        const cycleNum = idx + 1;
        const lapT = formatTimeValue(c.lapTime);
        const vsT = c.vsTarget > 0 ? `+${formatTimeValue(c.vsTarget)}` : formatTimeValue(c.vsTarget);
        const timestampFormatted = new Date(c.timestamp).toLocaleString('id-ID');
        const totalSeconds = state.timeUnit === 'minutes' ? c.lapTime * 60 : c.lapTime;
        const capacityPcsPerHour = totalSeconds > 0 ? Math.floor(3600 / totalSeconds) : 0;

        let statusText = 'Normal Balance';
        if (c.id === maxProcessId) statusText = 'Improve Immediately';
        else if (c.lapTime > state.taktTime) statusText = 'Bottleneck';
        else if (c.lapTime <= state.taktTime / 2) statusText = 'Potential Combine';

        return `
          <tr>
            <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">${cycleNum}</td>
            <td style="border: 1px solid #cbd5e1; padding: 8px;">${timestampFormatted}</td>
            <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-weight: bold;">${lapT} ${getUnitSymbol()}</td>
            <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right;">${vsT} ${getUnitSymbol()}</td>
            <td style="border: 1px solid #cbd5e1; padding: 8px;">${escapeHtml(c.processName || '-')}</td>
            <td style="border: 1px solid #cbd5e1; padding: 8px;">${escapeHtml(c.operatorName || '-')}</td>
            <td style="border: 1px solid #cbd5e1; padding: 8px;">${escapeHtml(c.machineName || '-')}</td>
            <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">${statusText}</td>
            <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right;">${capacityPcsPerHour} pcs/jam</td>
          </tr>
        `;
      }).join('');

      const excelHtml = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
        <head><meta charset="utf-8" /></head>
        <body>
          <h3>REPORT CYCLE TIME HARYAN</h3>
          <p><b>Line:</b> ${escapeHtml(state.lineName)} | <b>Style:</b> ${escapeHtml(state.styleName)} | <b>Takt Time:</b> ${state.taktTime}${getUnitSymbol()} | <b>Total CT:</b> ${formatTimeValue(totalCycleTime)}${getUnitSymbol()} | <b>Avg CT Total:</b> ${formatTimeValue(averageCycleTime)}${getUnitSymbol()} | <b>Kapasitas Total:</b> ${overallCapacityPcs} pcs/jam</p>
          <table>
            <thead>
              <tr style="background: #0f172a; color: #ffffff;">
                <th>Cycle #</th><th>Waktu</th><th>Lap Time</th><th>Vs Target</th><th>Proses</th><th>Operator</th><th>Machine</th><th>Action</th><th>Kapasitas</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </body>
        </html>
      `;

      const blob = new Blob([excelHtml], { type: 'application/vnd.ms-excel;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `report_cycle_time_${state.lineName.replace(/\s+/g, '_')}.xls`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // ============================================================================
    // 4. RENDER ANTARMUKA UI (100% LANGSUNG TANPA DELAY COMPILER)
    // ============================================================================
    function render() {
      const dark = state.isDarkMode;
      const unit = getUnitSymbol();
      const { totalCycleTime, averageCycleTime, overallCapacityPcs } = getMetrics();
      const sequentialData = getSequentialData();
      const sortedForChart = [...sequentialData].sort((a, b) => b.totalTime - a.totalTime);
      const topBottleneckIds = sortedForChart.slice(0, 2).map((i) => i.id);

      document.body.className = dark
        ? 'bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950'
        : 'bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-slate-950';

      // TAB 1: STOPWATCH LOG
      let tabContentHtml = '';
      if (state.activeTab === 'tracker') {
        const reversedCycles = [...state.cycles].reverse();
        const rowsHtml = reversedCycles.length === 0
          ? `<tr><td colspan="7" class="text-center py-12 ${dark ? 'text-slate-400' : 'text-slate-500'} text-sm">Belum ada data siklus. Tekan tombol <strong class="text-emerald-400">START</strong> lalu <strong class="text-emerald-400">LAP / CYCLE</strong> di bawah untuk mencatat waktu.</td></tr>`
          : reversedCycles.map((cycle, index) => {
              const cycleNum = index + 1;
              const isEdit = state.editingCycleId === cycle.id;
              const dispLap = isEdit ? state.seconds : cycle.lapTime;
              const dispVs = isEdit ? (state.seconds - state.taktTime) : cycle.vsTarget;
              const isOver = dispLap > state.taktTime;
              const fmtVs = dispVs > 0 ? `+${formatTimeValue(dispVs)}` : formatTimeValue(dispVs);

              return `
                <tr class="${isEdit ? (dark ? 'bg-amber-500/10 border-l-4 border-amber-500' : 'bg-amber-50 border-l-4 border-amber-500') : (dark ? 'hover:bg-slate-800/30' : 'hover:bg-slate-50')} transition-all">
                  <td class="p-3.5 font-bold whitespace-nowrap ${dark ? 'text-slate-200' : 'text-slate-800'}">#${cycleNum}</td>
                  <td class="p-3.5 font-mono font-bold text-base whitespace-nowrap">
                    ${isEdit
                      ? `<span class="text-amber-400 animate-pulse"><span id="edit-lap-${cycle.id}">${formatTimeValue(state.seconds)}${unit}</span> <span class="text-xs text-amber-500 ml-1 font-normal">(Ambil Ulang...)</span></span>`
                      : `<span class="text-emerald-400">${formatTimeValue(cycle.lapTime)}${unit}</span>`
                    }
                  </td>
                  <td class="p-3.5 font-mono font-semibold text-base whitespace-nowrap ${isOver ? 'text-rose-400' : 'text-emerald-400'}">${fmtVs}${unit}</td>
                  <td class="p-3.5">
                    <input type="text" value="${escapeHtml(cycle.processName)}" oninput="updateCycleField(${cycle.id}, 'processName', this.value)"
                      class="w-full min-w-[200px] ${dark ? 'bg-slate-950 border-slate-700/80 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'} border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" />
                  </td>
                  <td class="p-3.5">
                    <input type="text" value="${escapeHtml(cycle.operatorName)}" placeholder="Nama operator..." oninput="updateCycleField(${cycle.id}, 'operatorName', this.value)"
                      class="w-full min-w-[170px] ${dark ? 'bg-slate-950 border-slate-700/80 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'} border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" />
                  </td>
                  <td class="p-3.5">
                    <input type="text" value="${escapeHtml(cycle.machineName)}" placeholder="Jenis mesin..." oninput="updateCycleField(${cycle.id}, 'machineName', this.value)"
                      class="w-full min-w-[180px] ${dark ? 'bg-slate-950 border-slate-700/80 text-white placeholder-slate-600' : 'bg-slate-50 border-slate-300 text-slate-900 placeholder-slate-400'} border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" />
                  </td>
                  <td class="p-3.5 text-center whitespace-nowrap">
                    ${isEdit
                      ? `<div class="flex items-center justify-center gap-1.5">
                          <button onclick="confirmReTime()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-2.5 py-1.5 rounded-lg text-xs font-extrabold cursor-pointer">✓ Simpan</button>
                          <button onclick="cancelReTime()" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 px-2.5 py-1.5 rounded-lg text-xs font-bold cursor-pointer">✕</button>
                        </div>`
                      : `<div class="flex items-center justify-center gap-1.5">
                          <button onclick="startReTime(${cycle.id})" class="text-amber-400 hover:text-amber-300 px-2 py-1 rounded-lg text-xs font-bold border border-amber-500/30 cursor-pointer" title="Ambil Ulang Stopwatch">✎ Ulang</button>
                          <button onclick="deleteCycle(${cycle.id})" class="text-rose-400 hover:text-rose-300 px-2 py-1 rounded-lg text-xs font-bold border border-rose-500/30 cursor-pointer" title="Hapus Baris">🗑</button>
                        </div>`
                    }
                  </td>
                </tr>
              `;
            }).join('');

        tabContentHtml = `
          <section class="${dark ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-300 shadow-md'} border rounded-2xl p-4 sm:p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-base font-bold text-emerald-400">📊 Log Pencatatan (${state.cycles.length} Siklus)</h2>
              ${state.cycles.length > 0 ? `<button onclick="clearAllCycles()" class="text-xs sm:text-sm text-rose-400 hover:text-rose-300 font-bold cursor-pointer">🗑 Hapus Semua Log</button>` : ''}
            </div>
            <div id="log-table-container" class="overflow-x-auto overflow-y-auto custom-table-scroll border ${dark ? 'border-slate-800' : 'border-slate-200'} rounded-xl max-h-[52vh] pb-1">
              <table class="w-full min-w-[920px] text-left text-sm">
                <thead class="${dark ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-100 border-slate-200 text-slate-700'} border-b sticky top-0 z-10 whitespace-nowrap">
                  <tr>
                    <th class="p-3.5 w-24">Cycle #</th>
                    <th class="p-3.5">Lap Time (${unit})</th>
                    <th class="p-3.5">Vs Target (${unit})</th>
                    <th class="p-3.5 min-w-[210px]">Proses</th>
                    <th class="p-3.5 min-w-[180px]">Nama Operator</th>
                    <th class="p-3.5 min-w-[190px]">Machine</th>
                    <th class="p-3.5 w-32 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y ${dark ? 'divide-slate-800/40' : 'divide-slate-200'}">${rowsHtml}</tbody>
              </table>
            </div>
          </section>
        `;
      }

      // TAB 2: ANALISIS & PARETO
      if (state.activeTab === 'analysis') {
        const maxVal = sequentialData.length > 0 ? Math.max(...sequentialData.map((s) => s.totalTime), state.taktTime) : state.taktTime;
        const heightPx = 208;
        const taktRatio = maxVal > 0 ? Math.min(1, Math.max(0, state.taktTime / maxVal)) : 0;
        const bottomPixelOffset = Math.round(taktRatio * heightPx) + 48;

        const barsHtml = sequentialData.map((item) => {
          const isTopBottleneck = topBottleneckIds.includes(item.id);
          const isOverTakt = item.totalTime > state.taktTime;
          const isCombine = item.totalTime <= state.taktTime / 2;
          let barColor = 'bg-emerald-500';
          let textColor = 'text-emerald-500';
          if (isTopBottleneck) { barColor = 'bg-rose-600'; textColor = 'text-rose-500'; }
          else if (isOverTakt) { barColor = 'bg-amber-500'; textColor = 'text-amber-500'; }
          else if (isCombine) { barColor = 'bg-blue-500'; textColor = 'text-blue-400'; }

          const heightPercent = maxVal > 0 ? Math.min(100, Math.max(8, (item.totalTime / maxVal) * 100)) : 8;
          const isMaxBottleneck = sortedForChart[0]?.id === item.id;

          return `
            <div class="flex flex-col items-center gap-2 w-24 flex-shrink-0 z-0">
              <span class="text-xs font-bold ${textColor}">${item.totalTime}${unit}</span>
              <div class="w-full h-52 rounded-t-xl ${dark ? 'bg-slate-950' : 'bg-slate-200'} flex items-end justify-center p-1 relative overflow-hidden">
                <div class="w-full rounded-t-lg transition-all duration-500 relative ${barColor}" style="height: ${heightPercent}%">
                  ${isMaxBottleneck ? `<div class="absolute top-1 left-0 right-0 text-center"><span class="text-[8px] font-black uppercase text-white bg-black/60 px-1 py-0.5 rounded">MAX</span></div>` : ''}
                </div>
              </div>
              <div class="text-center w-full">
                <p class="text-xs font-bold truncate ${dark ? 'text-slate-200' : 'text-slate-800'}" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</p>
                <p class="text-[11px] font-extrabold text-emerald-400 mt-0.5">#${item.cycleNum}</p>
                <p class="text-[10px] text-slate-400 truncate">${escapeHtml(item.operatorName)}</p>
              </div>
            </div>
          `;
        }).join('');

        const detailRowsHtml = sequentialData.length === 0
          ? `<tr><td colspan="8" class="text-center py-8 text-slate-400">Tidak ada data rincian proses.</td></tr>`
          : sequentialData.map((item) => {
              const vsTargetVal = parseFloat((item.totalTime - state.taktTime).toFixed(1));
              const isOver = item.totalTime > state.taktTime;
              const isBottleneck = sortedForChart[0]?.id === item.id;
              const isCombine = item.totalTime <= state.taktTime / 2;
              const totalSecs = state.timeUnit === 'minutes' ? item.totalTime * 60 : item.totalTime;
              const capacityPcs = totalSecs > 0 ? Math.floor(3600 / totalSecs) : 0;

              let actionBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">✅ Normal Balance</span>`;
              if (isBottleneck) actionBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-black bg-rose-500/20 text-rose-400 border border-rose-500/40">🚨 Improve Immediately</span>`;
              else if (isOver) actionBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/40">⚠️ Bottleneck</span>`;
              else if (isCombine) actionBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-blue-500/20 text-blue-400 border border-blue-500/40">💡 Potential Combine</span>`;

              return `
                <tr class="${dark ? 'hover:bg-slate-800/30' : 'hover:bg-slate-50'}">
                  <td class="p-3.5 font-bold whitespace-nowrap">#${item.cycleNum}</td>
                  <td class="p-3.5 font-bold whitespace-nowrap">${escapeHtml(item.name)}</td>
                  <td class="p-3.5 text-slate-400 whitespace-nowrap">${escapeHtml(item.operatorName)}</td>
                  <td class="p-3.5 text-slate-400 whitespace-nowrap">${escapeHtml(item.machineName)}</td>
                  <td class="p-3.5 font-mono font-bold text-emerald-400 whitespace-nowrap">${item.totalTime}${unit}</td>
                  <td class="p-3.5 font-mono font-bold whitespace-nowrap ${isOver ? 'text-rose-400' : 'text-emerald-400'}">${vsTargetVal > 0 ? '+' + vsTargetVal : vsTargetVal}${unit}</td>
                  <td class="p-3.5 whitespace-nowrap">${actionBadge}</td>
                  <td class="p-3.5 font-mono font-bold text-cyan-400 whitespace-nowrap">${capacityPcs} <span class="text-xs font-normal text-slate-400">pcs/jam</span></td>
                </tr>
              `;
            }).join('');

        tabContentHtml = `
          <div class="space-y-6">
            <section class="${dark ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-300 shadow-md'} border rounded-2xl p-4 sm:p-6 shadow-xl">
              <div class="flex items-center justify-between flex-wrap gap-2 mb-6">
                <h2 class="text-lg font-bold text-emerald-400">📈 Analisis Pareto & Bottleneck Proses</h2>
                ${sortedForChart.length > 0 ? `<span class="text-xs font-semibold px-3 py-1 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30">⚠️ Bottleneck Utama: ${escapeHtml(sortedForChart[0].name)}</span>` : ''}
              </div>
              ${sequentialData.length === 0
                ? `<div class="text-center py-12 text-slate-400">Belum ada data untuk dianalisis. Silakan rekam waktu pada menu Stopwatch terlebih dahulu.</div>`
                : `<div class="overflow-x-auto custom-table-scroll pb-4 pt-6">
                    <div class="relative flex items-end gap-6 min-w-max h-80 px-4 border-b border-slate-800">
                      <div class="absolute left-0 right-0 border-b-2 border-dashed border-rose-500 z-20 pointer-events-none flex items-center justify-end pr-4" style="bottom: ${bottomPixelOffset}px">
                        <span class="text-[10px] font-extrabold bg-rose-600 text-white px-2 py-0.5 rounded shadow">Target Takt Time: ${state.taktTime}${unit}</span>
                      </div>
                      ${barsHtml}
                    </div>
                  </div>`
              }
            </section>

            <section class="${dark ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-300 shadow-md'} border rounded-2xl p-4 sm:p-6 shadow-xl">
              <h2 class="text-lg font-bold text-emerald-400 mb-4">📋 Detail Analysis & Action</h2>
              <div class="overflow-x-auto custom-table-scroll border ${dark ? 'border-slate-800' : 'border-slate-200'} rounded-xl pb-1">
                <table class="w-full min-w-[880px] text-left text-sm">
                  <thead class="${dark ? 'bg-slate-950 border-slate-800 text-slate-300' : 'bg-slate-100 border-slate-200 text-slate-700'} border-b whitespace-nowrap">
                    <tr>
                      <th class="p-3.5 w-20">Cycle #</th>
                      <th class="p-3.5">Proses</th>
                      <th class="p-3.5">Operator</th>
                      <th class="p-3.5">Machine</th>
                      <th class="p-3.5">CT (${unit})</th>
                      <th class="p-3.5">Vs Takt (${unit})</th>
                      <th class="p-3.5">Action</th>
                      <th class="p-3.5">Kapasitas Maks (pcs/jam)</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y ${dark ? 'divide-slate-800/40' : 'divide-slate-200'}">${detailRowsHtml}</tbody>
                </table>
              </div>
            </section>
          </div>
        `;
      }

      // TAB 3: SETTING PARAMETER
      if (state.activeTab === 'settings') {
        tabContentHtml = `
          <section class="${dark ? 'bg-slate-900/60 border-slate-800' : 'bg-white border-slate-300 shadow-md'} border rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-emerald-400">⚙️ Setting Parameter Line</h2>
            <div class="flex flex-col space-y-4">
              <div>
                <label class="text-xs font-bold block mb-1.5">Line Produksi</label>
                <input type="text" value="${escapeHtml(state.lineName)}" oninput="state.lineName=this.value; persistAll();"
                  class="w-full ${dark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'} border rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" />
              </div>
              <div>
                <label class="text-xs font-bold block mb-1.5">Model / Style</label>
                <input type="text" value="${escapeHtml(state.styleName)}" oninput="state.styleName=this.value; persistAll();"
                  class="w-full ${dark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'} border rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" />
              </div>
              <div>
                <label class="text-xs font-bold block mb-1.5">Target Takt Time (${unit})</label>
                <input type="number" value="${state.taktTime}" oninput="state.taktTime=Number(this.value)||0; persistAll();"
                  class="w-full ${dark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'} border rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500" />
              </div>
              <div>
                <label class="text-xs font-bold block mb-1.5">Satuan Waktu</label>
                <select onchange="state.timeUnit=this.value; persistAll(); render();"
                  class="w-full ${dark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'} border rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
                  <option value="seconds" ${state.timeUnit === 'seconds' ? 'selected' : ''}>Detik / Seconds (s)</option>
                  <option value="minutes" ${state.timeUnit === 'minutes' ? 'selected' : ''}>Menit / Minutes (m)</option>
                </select>
              </div>
            </div>
            <div class="pt-4 border-t border-slate-800/60 flex justify-end">
              <button onclick="state.activeTab='tracker'; render();" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-6 py-3 rounded-xl font-bold text-sm shadow-lg cursor-pointer">
                ✓ Simpan & Kembali ke Stopwatch
              </button>
            </div>
          </section>
        `;
      }

      // DROPDOWN MENU
      const menuHtml = state.isMenuOpen ? `
        <div class="fixed inset-0 bg-slate-950/60 z-40" onclick="state.isMenuOpen=false; render();"></div>
        <div class="absolute top-full right-2 sm:right-4 mt-2 w-80 z-50 p-4 rounded-2xl border shadow-2xl ${dark ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-900'}">
          <div class="space-y-4">
            <div>
              <label class="text-xs font-extrabold uppercase tracking-wider block mb-2 text-slate-400">Navigasi Modul</label>
              <div class="grid grid-cols-3 gap-1.5">
                <button onclick="state.activeTab='settings'; state.isMenuOpen=false; render();" class="p-2 rounded-xl text-xs font-bold border text-center cursor-pointer ${state.activeTab === 'settings' ? 'bg-emerald-500 border-emerald-500 text-slate-950' : (dark ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-slate-100 border-slate-300 text-slate-700')}">Setting</button>
                <button onclick="state.activeTab='tracker'; state.isMenuOpen=false; render();" class="p-2 rounded-xl text-xs font-bold border text-center cursor-pointer ${state.activeTab === 'tracker' ? 'bg-emerald-500 border-emerald-500 text-slate-950' : (dark ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-slate-100 border-slate-300 text-slate-700')}">Stopwatch</button>
                <button onclick="state.activeTab='analysis'; state.isMenuOpen=false; render();" class="p-2 rounded-xl text-xs font-bold border text-center cursor-pointer ${state.activeTab === 'analysis' ? 'bg-emerald-500 border-emerald-500 text-slate-950' : (dark ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-slate-100 border-slate-300 text-slate-700')}">Analisis</button>
              </div>
            </div>
            <div>
              <label class="text-xs font-extrabold uppercase tracking-wider block mb-2 text-slate-400">Ekspor Laporan</label>
              <button onclick="exportExcelReport(); state.isMenuOpen=false; render();" ${state.cycles.length === 0 ? 'disabled' : ''} class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white p-2.5 rounded-xl text-xs font-bold shadow-md cursor-pointer">
                ⬇ Download Laporan Excel (.xls)
              </button>
            </div>
            <div class="pt-3 border-t ${dark ? 'border-slate-800' : 'border-slate-200'}">
              <label class="text-xs font-extrabold uppercase tracking-wider block mb-2 text-slate-400">Tampilan & Skala</label>
              <div class="flex items-center justify-between gap-2">
                <button onclick="state.isDarkMode=!state.isDarkMode; persistAll(); render();" class="flex-1 p-2 rounded-xl text-xs font-bold border cursor-pointer ${dark ? 'bg-slate-800 border-slate-700 text-amber-400' : 'bg-slate-100 border-slate-300 text-slate-700'}">
                  ${dark ? '☀️ Light Mode' : '🌙 Dark Mode'}
                </button>
                <div class="flex items-center p-1 rounded-xl border ${dark ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-300'}">
                  <button onclick="state.zoomLevel=Math.max(50, state.zoomLevel-10); render();" class="px-2 py-1 text-xs font-bold cursor-pointer">-</button>
                  <span class="text-xs font-bold px-1">${state.zoomLevel}%</span>
                  <button onclick="state.zoomLevel=Math.min(150, state.zoomLevel+10); render();" class="px-2 py-1 text-xs font-bold cursor-pointer">+</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      ` : '';

      const appEl = document.getElementById('app');
      appEl.innerHTML = `
        <div class="min-h-screen pb-40 text-base origin-top-left overflow-x-hidden" style="transform: scale(${state.zoomLevel / 100}); width: ${100 / (state.zoomLevel / 100)}%; min-height: ${100 / (state.zoomLevel / 100)}vh;">
          
          <!-- HEADER -->
          <header class="${dark ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200 shadow-sm'} border-b sticky top-0 z-30 backdrop-blur-md px-3 sm:px-8 py-3.5 flex items-center justify-between flex-wrap gap-2">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 flex-shrink-0 text-slate-950 font-black text-lg">⏱</div>
              <div>
                <h1 class="text-base sm:text-lg font-extrabold tracking-tight leading-tight">Cycle Time Haryan</h1>
                <p class="text-xs ${dark ? 'text-slate-400' : 'text-slate-500'} hidden sm:block">${escapeHtml(state.lineName)} — ${escapeHtml(state.styleName)} (Takt: ${state.taktTime}${unit})</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <span class="text-[11px] font-bold px-2.5 py-1.5 rounded-lg border ${state.isOnline ? (dark ? 'bg-slate-800/80 border-slate-700 text-emerald-400' : 'bg-emerald-50 border-emerald-200 text-emerald-700') : 'bg-amber-500/15 border-amber-500/40 text-amber-400'}">
                ${state.isOnline ? '● Offline Ready' : '● Offline Mode'}
              </span>
              <span class="text-xs font-bold px-3 py-1.5 rounded-lg ${dark ? 'bg-slate-800 text-emerald-400' : 'bg-slate-200 text-emerald-700'}">
                ${state.activeTab === 'tracker' ? 'Stopwatch' : state.activeTab === 'analysis' ? 'Analisis' : 'Setting'}
              </span>
              <button onclick="state.isMenuOpen=!state.isMenuOpen; render();" class="px-3.5 py-2 rounded-xl text-sm font-bold border cursor-pointer ${dark ? 'bg-slate-800 border-slate-700 text-white hover:bg-slate-700' : 'bg-slate-100 border-slate-300 text-slate-800 hover:bg-slate-200'}">
                ${state.isMenuOpen ? '✕ Tutup' : '☰ Menu'}
              </button>
            </div>
            ${menuHtml}
          </header>

          <!-- MAIN CONTENT -->
          <main class="max-w-7xl mx-auto px-3 sm:px-8 py-4 sm:py-6 space-y-6">
            ${tabContentHtml}
          </main>

          <!-- BOTTOM STOPWATCH CONTROLLER -->
          <div class="fixed bottom-0 left-0 right-0 z-50 ${dark ? 'bg-slate-950/95 border-slate-800' : 'bg-white/95 border-slate-300'} border-t backdrop-blur-md p-3 sm:p-4 shadow-2xl">
            <div class="max-w-7xl mx-auto flex flex-col gap-2.5">
              
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-4 px-3 py-2 rounded-xl border w-full ${dark ? 'bg-slate-900/90 border-slate-800' : 'bg-slate-100 border-slate-200'}">
                <div class="flex items-center justify-between sm:justify-center gap-2 border-r border-b sm:border-b-0 pb-1 sm:pb-0 pr-2 sm:pr-4 border-slate-700/50">
                  <span class="text-[10px] sm:text-xs font-bold uppercase text-slate-400">STOPWATCH:</span>
                  <div class="font-mono text-base sm:text-lg font-black text-amber-400 flex items-baseline gap-0.5">
                    <span id="live-stopwatch-val">${formatTimeValue(state.seconds)}</span>
                    <span class="text-[10px] font-normal text-amber-500">${unit}</span>
                  </div>
                </div>

                <div class="flex items-center justify-between sm:justify-center gap-2 border-b sm:border-b-0 sm:border-r pb-1 sm:pb-0 pl-1 sm:pl-0 sm:pr-4 border-slate-700/50">
                  <span class="text-[10px] sm:text-xs font-bold uppercase text-slate-400">TOTAL CT:</span>
                  <div class="font-mono text-base sm:text-lg font-black text-emerald-400 flex items-baseline gap-0.5">
                    <span>${formatTimeValue(totalCycleTime)}</span>
                    <span class="text-[10px] font-normal text-emerald-500">${unit}</span>
                  </div>
                </div>

                <div class="flex items-center justify-between sm:justify-center gap-2 border-r pt-1 sm:pt-0 pr-2 sm:pr-4 border-slate-700/50">
                  <span class="text-[10px] sm:text-xs font-bold uppercase text-slate-400">AVG CT:</span>
                  <div class="font-mono text-base sm:text-lg font-black text-cyan-400 flex items-baseline gap-0.5">
                    <span>${formatTimeValue(averageCycleTime)}</span>
                    <span class="text-[10px] font-normal text-cyan-500">${unit}</span>
                  </div>
                </div>

                <div class="flex items-center justify-between sm:justify-center gap-2 pt-1 sm:pt-0 pl-1 sm:pl-0">
                  <span class="text-[10px] sm:text-xs font-bold uppercase text-slate-400">KAPASITAS:</span>
                  <div class="font-mono text-base sm:text-lg font-black text-purple-400 flex items-baseline gap-0.5">
                    <span>${overallCapacityPcs}</span>
                    <span class="text-[10px] font-normal text-purple-400">pcs/h</span>
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-4 gap-2 sm:gap-3 w-full">
                <button onclick="startStopwatch()" ${state.isRunning ? 'disabled' : ''} class="bg-emerald-500 hover:bg-emerald-400 disabled:opacity-40 text-slate-950 px-4 py-3 rounded-xl font-extrabold text-xs sm:text-sm shadow-lg cursor-pointer">▶ START</button>
                <button onclick="stopStopwatch()" ${!state.isRunning ? 'disabled' : ''} class="bg-rose-600 hover:bg-rose-500 disabled:opacity-40 text-white px-4 py-3 rounded-xl font-extrabold text-xs sm:text-sm shadow-lg cursor-pointer">■ STOP</button>
                <button onclick="resetStopwatch()" class="p-3 rounded-xl font-bold border cursor-pointer ${dark ? 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700' : 'bg-slate-200 border-slate-300 text-slate-800 hover:bg-slate-300'}">↺ RESET</button>
                <button onclick="recordLap()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-3 rounded-xl font-extrabold text-xs sm:text-sm shadow-lg cursor-pointer">+ LAP / CYCLE</button>
              </div>

            </div>
          </div>

        </div>
      `;
    }

    // ============================================================================
    // 5. BOOTSTRAP AWAL & REGISTRASI PWA OFFLINE
    // ============================================================================
    (async function initApp() {
      // Langsung render tampilan seketika agar tidak pernah muncul layar putih
      render();

      window.addEventListener('online', () => { state.isOnline = true; render(); });
      window.addEventListener('offline', () => { state.isOnline = false; render(); });

      // Muat data tersimpan dari IndexedDB
      const savedCycles = await loadFromDB('cycles_data');
      const savedSettings = await loadFromDB('settings_data');
      if (Array.isArray(savedCycles)) state.cycles = savedCycles;
      if (savedSettings) {
        if (typeof savedSettings.taktTime === 'number') state.taktTime = savedSettings.taktTime;
        if (savedSettings.timeUnit) state.timeUnit = savedSettings.timeUnit;
        if (savedSettings.lineName) state.lineName = savedSettings.lineName;
        if (savedSettings.styleName) state.styleName = savedSettings.styleName;
        if (typeof savedSettings.isDarkMode === 'boolean') state.isDarkMode = savedSettings.isDarkMode;
      }
      render();

      // Manifest PWA
      try {
        const manifestObj = {
          name: 'Cycle Time Haryan - Offline Stopwatch',
          short_name: 'CycleTime',
          start_url: './',
          display: 'standalone',
          background_color: '#020617',
          theme_color: '#10b981',
          icons: [{
            src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%2310b981'/%3E%3Ccircle cx='96' cy='96' r='56' fill='none' stroke='%23020617' stroke-width='14'/%3E%3Cpath d='M96 62v38l26 16' fill='none' stroke='%23020617' stroke-width='14' stroke-linecap='round'/%3E%3C/svg%3E",
            sizes: '192x192',
            type: 'image/svg+xml'
          }]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
      } catch (e) {}
    })();
  </script>
</body>
</html>
